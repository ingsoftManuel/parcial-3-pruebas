name: E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medical_appointments
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Install E2E Test Dependencies
        working-directory: ./e2e-tests
        run: npm install

      - name: Install Playwright with Browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./e2e-tests

      - name: Start Backend
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: medical_appointments
          DB_USER: postgres
          DB_PASSWORD: postgres
          PORT: 5000
          NODE_ENV: test
        run: |
          npm start > backend.log 2>&1 &
          echo $! > backend.pid
          sleep 5

      - name: Check Backend Status
        run: |
          if ! curl -f http://localhost:5000/api/health; then
            echo "Backend failed to start. Logs:"
            cat backend/backend.log
            exit 1
          fi
          echo "Backend is running!"

      - name: Build Frontend
        working-directory: ./frontend
        env:
          REACT_APP_API_URL: http://localhost:5000/api
          CI: false
        run: npm run build

      - name: Install serve
        run: npm install -g serve

      - name: Start Frontend
        working-directory: ./frontend
        run: |
          serve -s build -l 3000 > frontend.log 2>&1 &
          echo $! > frontend.pid
          sleep 5

      - name: Check Frontend Status
        run: |
          if ! curl -f http://localhost:3000; then
            echo "Frontend failed to start. Logs:"
            cat frontend/frontend.log
            exit 1
          fi
          echo "Frontend is running!"

      - name: Run E2E Tests
        working-directory: ./e2e-tests
        run: npm test

      - name: Print OK on Success
        if: success()
        run: echo "OK"

      - name: Stop Services
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then kill $(cat backend/backend.pid) || true; fi
          if [ -f frontend/frontend.pid ]; then kill $(cat frontend/frontend.pid) || true; fi

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/
          retention-days: 7

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e-tests/test-results/
          retention-days: 7